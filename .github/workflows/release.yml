name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      - name: 校验 tag 与 manifest 版本一致
        run: node scripts/check-release-tag.mjs "${{ github.ref_name }}"

      - name: 类型检查 + 打包
        run: npm run build

      - name: 上架自检
        run: npm run check

      - name: 创建 Release（附 main.js / manifest.json / styles.css）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            main.js manifest.json styles.css \
            --title "${{ github.ref_name }}" \
            --generate-notes
